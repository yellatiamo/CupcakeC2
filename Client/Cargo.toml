[workspace]
members = [
    "core",
    "stager",
    # Product L2: bof (classic in-process COFF) / inject worker / ad worker
    "modules/bof",
    "modules/inject",
    "modules/ad",
    # iso_host sacrificial PE retired — BOF runs classic in-process via modules/bof,
    # dotnet replaced by shellcode inject; inject is a self-contained worker EXE.
]
resolver = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# abort: smaller binary (no unwinding tables). Stage0 is zero-panic by design;
# L2 faults should not rely on catch_unwind in the agent process.
panic = "abort"
strip = "symbols"

[profile.release.build-override]
opt-level = "z"
